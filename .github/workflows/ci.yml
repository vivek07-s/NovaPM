name: CI
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev xorg-dev libgl1-mesa-dev
      - name: Configure (CLI + GUI + tests)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test (unit + end-to-end guard test)
        run: ctest --test-dir build --output-on-failure
      - name: Package (.tar.gz and .deb)
        run: cd build && cpack
      - uses: actions/upload-artifact@v4
        with: { name: novapm-linux, path: "build/novapm-*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package (.zip)
        run: cd build && cpack -C Release
      - uses: actions/upload-artifact@v4
        with: { name: novapm-windows, path: "build/novapm-*.zip" }
